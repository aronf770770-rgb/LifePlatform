<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות - פלטפורמת החיים</title>
    <!-- טעינת העיצוב הגלובלי ואז את העיצוב הספציפי של דף ההתחברות -->
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>פלטפורמת החיים</h1>
            <p>אנא הזן פרטי התחברות</p>
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">שם משתמש</label>
                    <input type="text" id="username" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="password">סיסמה</label>
                    <input type="password" id="password" required>
                </div>
                <div id="errorMessage" class="error-message"></div>
                <button type="submit" class="btn">כניסה</button>
            </form>
        </div>
    </div>
    
    <!-- טעינת הלוגיקה של ההתחברות -->
    <script src="auth.js"></script>
</body>
</html>
