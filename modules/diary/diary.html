<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יומן אישי - פלטפורמת החיים</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="diary.css">
</head>
<body>
    <div class="main-content">
        <div class="header-actions">
            <h1>יומן אישי</h1>
        </div>
        
        <div class="calendar-container">
            <div class="calendar-header">
                <button type="button" class="btn btn-ghost" onclick="DiaryManager.prevMonth()">&#8594; חודש קודם</button>
                <h2 id="monthYearDisplay">--</h2>
                <button type="button" class="btn btn-ghost" onclick="DiaryManager.nextMonth()">חודש הבא &#8592;</button>
            </div>
            
            <div class="calendar-grid">
                <div class="weekday">ראשון</div>
                <div class="weekday">שני</div>
                <div class="weekday">שלישי</div>
                <div class="weekday">רביעי</div>
                <div class="weekday">חמישי</div>
                <div class="weekday">שישי</div>
                <div class="weekday">שבת</div>
                
                <div id="calendarDays" class="days-container"></div>
            </div>
        </div>
    </div>

    <!-- חלון קופץ: עריכת יום ביומן -->
    <div id="dayModal" class="modal-overlay">
        <div class="modal-content modal-large">
            <button type="button" class="close-modal">&times;</button>
            
            <!-- כותרת החלון יחד עם כפתור המחיקה -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-left: 20px;">
                <h2 id="modalDateTitle" style="margin: 0;">יומן אישי - </h2>
                <button type="button" class="btn-ghost delete-btn" id="deleteDayBtn" onclick="DiaryManager.deleteDay()" style="border:none; color:var(--danger-color); display: none;">מחק רשומה</button>
            </div>
            
            <input type="hidden" id="currentEditDate">

            <div class="input-group">
                <label>נתיב תמונה (אופציונלי):</label>
                <input type="text" id="dayImagePath" placeholder="לדוגמה: C:\Pictures\photo.jpg">
            </div>
            
            <div id="dayImagePreview" class="day-image-preview"></div>

            <div class="input-group">
                <label>מה היה היום?</label>
                <textarea id="dayContent" rows="10" placeholder="כתוב כאן את סיכום היום שלך..."></textarea>
            </div>

            <button type="button" class="btn" onclick="DiaryManager.saveDay()" style="width: 100%;">שמור רשומה</button>
        </div>
    </div>

    <script src="../../js/DataService.js"></script>
    <script src="../../js/AppManager.js"></script>
    <script src="../../js/ModalUtils.js"></script>
    <script src="diary.js"></script>
</body>
</html>
