<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פאקמן - משחק עצמאי</title>
    <link rel="stylesheet" href="../../../../css/global.css">
    <link rel="stylesheet" href="pacman.css">
</head>
<body>
    <div class="game-header">
        <a href="../../games.html" class="btn btn-ghost">חזור למרכז המשחקים</a>
        <h2>פאקמן - ארקייד</h2>
    </div>

    <div class="game-wrapper">
        <div class="stats-panel">
            <div class="stat-box">ניקוד: <span id="scoreDisplay" style="color: #f1c40f;">0</span></div>
            <div class="stat-box">שלב: <span id="levelDisplay">1</span></div>
            <div class="stat-box">חיים: <span id="livesDisplay" style="color: #e74c3c;">❤️❤️❤️</span></div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="570" height="570"></canvas>
            
            <!-- חלון סיום/מעבר שלב -->
            <div id="overlay" class="overlay" style="display: none;">
                <h1 id="overlay-title">המשחק נגמר</h1>
                <p id="overlay-text">הגעת לניקוד: 0</p>
                <button id="overlay-btn" class="btn" onclick="startLevel()">התחל מחדש</button>
            </div>
        </div>
        
        <div class="controls-hint">
            <p>השתמש בחצים במקלדת כדי לזוז (↑ ↓ ← →)</p>
            <p>🍎 תפוח מעניק חיים נוספים! | סיימו את הנקודות כדי לעלות שלב.</p>
        </div>
    </div>

    <script src="pacman.js"></script>
</body>
</html>
